name: Build OTP Releases

on:
  push:
    tags:
      - "OTP-*"
  workflow_dispatch:
    inputs:
      otp_version:
        description: OTP version to build
        type: string
        required: true

jobs:
  build-static:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: alpine:3.22

    strategy:
      fail-fast: false
      matrix:
        rebar3_version:
          - "3.27.0"
        arch:
          - "x64"
          - "arm64"

    steps:
      - name: Checkout repository
        uses: taiki-e/checkout-action@v1

      - name: Extract OTP version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_OTP_VERSION: ${{ inputs.otp_version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            OTP_VERSION="${GITHUB_REF#refs/tags/OTP-}"
          else
            OTP_VERSION="$INPUT_OTP_VERSION"
          fi
          if ! printf '%s' "$OTP_VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){0,3}(-rc[0-9]+)?$'; then
            echo "Invalid OTP version: '$OTP_VERSION'" >&2
            exit 1
          fi
          echo "otp_version=$OTP_VERSION" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Build
        env:
          OTP_VERSION: ${{ steps.version.outputs.otp_version }}
          REBAR3_VERSION: ${{ matrix.rebar3_version }}
        run: |
          chmod +x ./build.sh
          export OTP_VERSION REBAR3_VERSION
          ./build.sh

      - name: Create tar.gz archive
        env:
          OTP_VERSION: ${{ steps.version.outputs.otp_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          cd /usr/local/lib/erlang
          tar -czf "/tmp/erlang-${OTP_VERSION}-${ARCH}.tar.gz" *

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          OTP_VERSION: ${{ steps.version.outputs.otp_version }}
          ARCH: ${{ matrix.arch }}
          REPO: ${{ github.repository }}
        run: |
          apk add --no-cache github-cli
          gh release create "OTP-${OTP_VERSION}" \
            "/tmp/erlang-${OTP_VERSION}-${ARCH}.tar.gz" \
            --title "OTP ${OTP_VERSION}" \
            --notes "Erlang/OTP ${OTP_VERSION} built for Linux" \
            --repo "$REPO" || \
          gh release upload "OTP-${OTP_VERSION}" \
            "/tmp/erlang-${OTP_VERSION}-${ARCH}.tar.gz" \
            --repo "$REPO" \
            --clobber

  build-musl:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: alpine:3.22

    strategy:
      fail-fast: false
      matrix:
        rebar3_version:
          - "3.27.0"
        arch:
          - "x64"
          - "arm64"

    steps:
      - name: Checkout repository
        uses: taiki-e/checkout-action@v1

      - name: Extract OTP version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_OTP_VERSION: ${{ inputs.otp_version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            OTP_VERSION="${GITHUB_REF#refs/tags/OTP-}"
          else
            OTP_VERSION="$INPUT_OTP_VERSION"
          fi
          if ! printf '%s' "$OTP_VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){0,3}(-rc[0-9]+)?$'; then
            echo "Invalid OTP version: '$OTP_VERSION'" >&2
            exit 1
          fi
          echo "otp_version=$OTP_VERSION" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Build
        env:
          OTP_VERSION: ${{ steps.version.outputs.otp_version }}
          REBAR3_VERSION: ${{ matrix.rebar3_version }}
        run: |
          chmod +x ./build-musl.sh
          export OTP_VERSION REBAR3_VERSION
          ./build-musl.sh

      - name: Create tar.gz archive
        env:
          OTP_VERSION: ${{ steps.version.outputs.otp_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          cd /usr/local/lib/erlang/
          tar -czf "/tmp/erlang-${OTP_VERSION}-${ARCH}-musl.tar.gz" *

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          OTP_VERSION: ${{ steps.version.outputs.otp_version }}
          ARCH: ${{ matrix.arch }}
          REPO: ${{ github.repository }}
        run: |
          apk add --no-cache github-cli
          gh release create "OTP-${OTP_VERSION}" \
            "/tmp/erlang-${OTP_VERSION}-${ARCH}-musl.tar.gz" \
            --title "OTP ${OTP_VERSION}" \
            --notes "Erlang/OTP ${OTP_VERSION} built for Linux" \
            --repo "$REPO" || \
          gh release upload "OTP-${OTP_VERSION}" \
            "/tmp/erlang-${OTP_VERSION}-${ARCH}-musl.tar.gz" \
            --repo "$REPO" \
            --clobber

  build-glibc:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: debian:bookworm-slim

    strategy:
      fail-fast: false
      matrix:
        rebar3_version:
          - "3.27.0"
        arch:
          - "x64"
          - "arm64"

    steps:
      - name: Checkout repository
        uses: taiki-e/checkout-action@v1

      - name: Extract OTP version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_OTP_VERSION: ${{ inputs.otp_version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            OTP_VERSION="${GITHUB_REF#refs/tags/OTP-}"
          else
            OTP_VERSION="$INPUT_OTP_VERSION"
          fi
          if ! printf '%s' "$OTP_VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){0,3}(-rc[0-9]+)?$'; then
            echo "Invalid OTP version: '$OTP_VERSION'" >&2
            exit 1
          fi
          echo "otp_version=$OTP_VERSION" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Build
        env:
          OTP_VERSION: ${{ steps.version.outputs.otp_version }}
          REBAR3_VERSION: ${{ matrix.rebar3_version }}
        run: |
          chmod +x ./build-glibc.sh
          export OTP_VERSION REBAR3_VERSION
          ./build-glibc.sh

      - name: Create tar.gz archive
        env:
          OTP_VERSION: ${{ steps.version.outputs.otp_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          cd /usr/local/lib/erlang
          tar -czf "/tmp/erlang-${OTP_VERSION}-${ARCH}-glibc.tar.gz" *

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          OTP_VERSION: ${{ steps.version.outputs.otp_version }}
          ARCH: ${{ matrix.arch }}
          REPO: ${{ github.repository }}
        run: |
          apt install -y --no-install-recommends gh
          gh release create "OTP-${OTP_VERSION}" \
            "/tmp/erlang-${OTP_VERSION}-${ARCH}-glibc.tar.gz" \
            --title "OTP ${OTP_VERSION}" \
            --notes "Erlang/OTP ${OTP_VERSION} built for Linux" \
            --repo "$REPO" || \
          gh release upload "OTP-${OTP_VERSION}" \
            "/tmp/erlang-${OTP_VERSION}-${ARCH}-glibc.tar.gz" \
            --repo "$REPO" \
            --clobber
